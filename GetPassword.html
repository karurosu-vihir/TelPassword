<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Input</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color:  #fff;
            color: #000;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2481cc;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h3>Enter password</h3>
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="off">
    <button onclick="submitPwd()">Submit</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function submitPwd() {
            const value = document.getElementById('pwd').value;
            if (!value) {
                tg.showAlert("Please enter a value");
                return;
            }
            tg.sendData(value);
            tg.close();
        }
    </script>
</body>
</html>
